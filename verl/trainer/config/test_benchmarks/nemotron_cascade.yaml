# Fixed local benchmark suite for Nemotron Cascade MOPD experiments. Paths are
# relative to data.test_benchmarks.root.

# Disable the legacy math-only loader when this suite is selected.
names: []

# Deterministic seed used for selection, option shuffling, and generation.
seed: 42

# Typed benchmark definitions with benchmark-specific budgets and sampling.
entries:

  - name: aime25
    adapter: aime
    path: math-ai/aime25
    batch_size: 30
    max_samples: -1
    prompt_max_length: 1024
    generation_max_tokens: 23552
    profiles:
      legacy:
        n: 1
      train_sampling:
        n: 16
    adapter_kwargs: {}

  - name: ifbench
    adapter: ifbench
    path: allenai/IFBench_test
    batch_size: 32
    max_samples: -1
    prompt_max_length: 4096
    generation_max_tokens: 4096
    profiles:
      legacy:
        n: 1
      train_sampling:
        n: 8
    adapter_kwargs: {}

  - name: mmlu_pro
    adapter: mmlu_pro
    path: TIGER-Lab/MMLU-Pro
    batch_size: 32
    max_samples: 1000
    prompt_max_length: 24576
    generation_max_tokens: 4096
    profiles:
      legacy:
        n: 1
      train_sampling:
        n: 1
    adapter_kwargs: {}

  - name: gpqa_diamond
    adapter: gpqa_diamond
    path: Idavidrein/gpqa
    batch_size: 16
    max_samples: -1
    prompt_max_length: 4096
    generation_max_tokens: 8192
    profiles:
      legacy:
        n: 1
      train_sampling:
        n: 8
    adapter_kwargs: {}

  - name: longbench_v2
    adapter: longbench_v2
    path: THUDM/LongBench-v2
    batch_size: 4
    max_samples: -1
    prompt_max_length: 31744
    generation_max_tokens: 1024
    profiles:
      legacy:
        n: 1
      train_sampling:
        n: 4
    adapter_kwargs: {}
