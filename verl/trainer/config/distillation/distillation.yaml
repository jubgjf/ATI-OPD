# Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
_target_: verl.workers.config.DistillationConfig

# specify the default per-component configs
defaults:

  # <folder_name>@<field_name>.<field_name>: <yaml_file_name>

  # load the default config, then apply the fields in the current yaml
  # self config override anything above
  - _self_

# Whether to enable distillation.
enabled: false

# Whether to add the built-in actor-side distillation loss. Set false for
# ADV_ESTIMATOR=token_reward_direct, where distillation enters as token rewards.
use_actor_loss: true

# distillation loss config
distillation_loss:

  # # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.workers.config.DistillationLossConfig


  # Loss function mode for distillation
  loss_mode: k3

  # If distillation loss requires top-k logits, this is the value of k
  topk: 32

  # Teacher support width for only_stu_teacher_topk. The student update still
  # uses topk above.
  teacher_topk: 128

  # Top-k support strategy for token-reward OPD.
  # only_stu keeps the historical teacher/student Top-K intersection approximation.
  # only_stu_teacher_topk keeps the student Top-K fixed while expanding teacher support.
  # only_stu_rethinking_style queries exact teacher log-probs for every student Top-K id.
  top_k_strategy: only_stu

  # Weighting scheme when reducing top-k token rewards to one scalar token reward.
  reward_weight_mode: student_p

  # Whether to include task rewards alongside distillation loss.
  use_task_rewards: true


  # The coef of the distillation loss when use_task_rewards is true
  distillation_loss_coef: 1.0

  # Coefficient of the independent RLVR policy-loss branch when using
  # ADV_ESTIMATOR=token_reward_direct. The joint objective is
  # loss_opd + rlvr_loss_coef * loss_rlvr.
  rlvr_loss_coef: 1.0

  # Advantage estimator for the independent RLVR branch.
  rlvr_adv_estimator: grpo

  # Teacher-intervention samples contribute to the raw GRPO baseline but do
  # not receive RLVR gradients in the initial implementation.
  rlvr_credit_mode: no_intervention_only

  # Optional max clamp value for distillation loss. If null, no clamping is applied.
  loss_max_clamp: null

  # Optional min clamp value for log probabilities for stability, e.g., log q - log p where p or q are very close to zero.
  log_prob_min_clamp: null

  # Whether to incorporate distillation loss as a reward.
  use_policy_gradient: false

  # Name of the policy loss to use when use_policy_gradient is true.
  policy_loss_mode: "vanilla"

  # PPO clipping ratio for policy loss.
  clip_ratio: 0.2

  # Lower bound for PPO clipping ratio.
  clip_ratio_low: 0.2 

  # Upper bound for PPO clipping ratio.
  clip_ratio_high: 0.2

  # TOPD/POPD-style prefix horizon for distillation supervision only.
  # The student still generates a full response; reward and PPO use the full response_mask.
  horizon:
    _target_: verl.workers.config.DistillationLossHorizonConfig
    # full: old behavior; fixed: TOPD fixed prefix; progressive: POPD increasing prefix.
    mode: full
    tokens: 4096
    start_tokens: 2048
    end_tokens: 4096
    increment_tokens: 512
    interval_steps: 50

# Teacher intervention config. When enabled, the student first completes a
# normal rollout; only segments whose teacher/student gap crosses the threshold
# are repaired by a short teacher generation followed by student suffix
# regeneration.
intervention:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.workers.config.DistillationInterventionConfig

  enabled: false
  segment_method: fixed_tokens
  student_segment_length: 128
  teacher_segment_length: 128
  # teacher_rejection computes min(cap, max(0, student_logprob - teacher_logprob)) per sampled token.
  gap_metric: k3
  gap_distribution_topk: 16
  # Per-token cap for gap_metric=teacher_rejection, before segment aggregation.
  teacher_rejection_token_cap: 10.0
  gap_aggregation: mean
  gap_threshold: 1.0
  # Optional second-stage confirmation for gap_metric=teacher_rejection. The
  # local trigger remains unchanged; when enabled, the capped mean rejection
  # over the following window must also cross the persistence threshold.
  teacher_rejection_persistence_enabled: false
  teacher_rejection_persistence_window_tokens: 64
  # null reuses gap_threshold.
  teacher_rejection_persistence_threshold: null
  teacher_rejection_persistence_min_valid_tokens: 32
  max_interventions_per_sample: 4
  # Optional short-horizon counterfactual confirmation. future_gap first
  # generates only future_gap_window_tokens after the teacher segment, then
  # commits and continues from the exact token-ID prefix only when that suffix
  # has both a safe absolute gap and a strict reduction relative to the
  # original on-policy suffix.
  # Independent pre-trigger gate: a correct raw on-policy answer bypasses all
  # intervention scoring and generation.
  skip_correct: false
  confirmation_mode: none
  future_gap_window_tokens: 64
  future_gap_min_valid_tokens: 32
  # null reuses gap_threshold on the active gap metric's scale.
  future_gap_max_threshold: null
  future_gap_min_reduction: 0.0
  train_on_teacher_segments: false
  # Keep full repaired generations for rewards and diagnostics, while limiting
  # distillation supervision to the first prefix plus inserted teacher span.
  prune: false
  # Training objective for teacher-inserted tokens when train_on_teacher_segments=true.
  # opd preserves the legacy behavior; sft applies CE only on teacher-inserted tokens.
  teacher_segment_loss_mode: opd
  teacher_segment_sft_loss_coef: 1.0
  min_trainable_tokens_after_repair: 1
  # Protect the tokenization of think tags, while keeping the thought contents
  # locally repairable. Complete tool-call blocks remain atomic.
  protect_thinking_blocks: true
  thinking_start_text: "<think>"
  thinking_end_text: "</think>"
  require_closed_thinking_on_terminal: true
  teacher_temperature: 0.6
  teacher_top_p: 0.95
  teacher_top_k: 20
  # Opt-in outcome-aware candidate selection. If enabled, only incorrect
  # on-policy responses may be repaired. The teacher samples several short
  # candidates; a rolling NLL threshold calibrated on correct on-policy
  # prefixes filters them before teacher/student NLL rank-sum selection.
  outcome_aware_candidate_selection_enabled: false
  outcome_correctness_key: acc
  outcome_correctness_threshold: 0.5
  teacher_candidate_count: 4
  # Shared cap across concurrent samples in each AgentLoopWorker. It applies
  # to candidate generation and teacher/student candidate NLL scoring RPCs.
  teacher_candidate_max_concurrency_per_worker: 4
  # Each healthy prefix contributes the minimum teacher NLL among its K
  # candidates. Updates are aggregated globally across rollout workers after
  # each batch, and one rolling threshold is broadcast for the next batch.
  teacher_nll_calibration_quantile: 0.75
  teacher_nll_calibration_window: 256
  teacher_nll_calibration_min_samples: 16
  # null means that repairs wait for enough healthy calibration prefixes.
  teacher_nll_initial_threshold: null
  # After calibration warmup, correct trigger-positive samples are
  # shadow-probed at this rate. Warmup probes all such samples; none are
  # rewritten.
  teacher_nll_healthy_probe_probability: 0.1
  log_examples_per_worker: 2

# Diagnostics for analyzing OPD behavior on long responses. Repetition defaults
# follow Stable-OPD's text-zlib definition on train/validation generations.
diagnostics:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.workers.config.DistillationDiagnosticsConfig

  enabled: false
  position_bin_size: 512
  log_interval: 1
  topk_log_interval: 10
  async_metrics: false
  # Compatibility-only: structured async diagnostics allow exactly one task in the current source step.
  async_max_pending: 1
  heatmap_interval: 10
  heatmap_history_steps: 80
  log_wandb_heatmap: true
  high_gap_threshold: 1.0
  collect_intervention_metrics: true
  # Collect repair-boundary diagnostics exclusively from tensors and scoring
  # results already produced by training. This never requests extra rollout,
  # forward, top-k, teacher scoring, or reward computation.
  collect_intervention_boundary_metrics: false
  # Full text is decoded only for the globally stable selected cases and is
  # available only with balanced metric archival.
  intervention_boundary_text_samples_per_step: 8
  intervention_boundary_text_context_tokens: 32
  # Score the raw response and the final response after all repairs, then
  # report the four sample-level correctness transitions.
  collect_intervention_outcome_transitions: false
  # Maximum number of full-text cases retained for each transition per event.
  # Compact numeric records are retained for every sample.
  outcome_case_samples_per_transition: 8
  collect_topk_overlap: false
  collect_rethinking_opd_metrics: false
  collect_repetition_metrics: true
  collect_train_text_zlib_repetition: true
  # null: follow distillation_loss.topk; set explicitly to request a wider/narrower diagnostics top-k.
  topk: null
  repetition_tail_chars: 10000
  repetition_comp_ratio_threshold: 10.0
  repetition_tail_token_window: 4096
  bad_tail_min_position: 12000
  bad_tail_deep_position: 16000
  bad_tail_extreme_position: 20000
  bad_tail_overlap_threshold: 0.5
  bad_tail_teacher_prob_threshold: 0.2
  bad_tail_gap_threshold: 1.0
  bad_tail_reward_threshold: -2.0
  bad_tail_entropy_threshold: 4.0


# Number of GPUs per node in the distillation teacher resource pool
n_gpus_per_node: 8

# Number of nodes in the distillation teacher resource pool
nnodes: 0

# multi-teacher configs
teacher_models:

  # Single-teacher config. This entry is popped when other teacher entries are added, so
  # using `teacher_model` as one of several keys silently drops it. For
  # example, the following CLI overrides result in ONLY `teacher_model2` being used:
  #
  # distillation.teacher_models.teacher_model.key=openai/gsm8k
  # distillation.teacher_models.teacher_model.model_path=Qwen/Qwen3-4B
  # +distillation.teacher_models.teacher_model2.key=hiyouga/geometry3k
  # +distillation.teacher_models.teacher_model2.model_path=Qwen/Qwen3-VL-4B-Instruct
  #
  # Instead, give the first teacher a different name:
  #
  # +distillation.teacher_models.teacher_model1.key=openai/gsm8k
  # +distillation.teacher_models.teacher_model1.model_path=Qwen/Qwen3-4B
  # +distillation.teacher_models.teacher_model2.key=hiyouga/geometry3k
  # +distillation.teacher_models.teacher_model2.model_path=Qwen/Qwen3-VL-4B-Instruct
  teacher_model:
    _target_: verl.workers.config.DistillationTeacherModelConfig
    key: null
    model_path: null
    num_replicas: 0
    inference:
      _target_: verl.workers.config.RolloutConfig
      name: ${oc.select:actor_rollout_ref.rollout.name}
      dtype: ${oc.select:actor_rollout_ref.rollout.dtype}
      gpu_memory_utilization: 0.5
      enforce_eager: true
      cudagraph_capture_sizes: null
      free_cache_engine: true
      data_parallel_size: 1
      expert_parallel_size: 1
      tensor_model_parallel_size: 2
      max_num_batched_tokens: 8192
      max_model_len: null
      max_num_seqs: 1024
      load_format: auto
      engine_kwargs: {}
      limit_images: null
      enable_chunked_prefill: true
      enable_prefix_caching: true
      disable_log_stats: true
      skip_tokenizer_init: true
      prompt_length: ${oc.select:actor_rollout_ref.rollout.prompt_length}
      response_length: ${oc.select:actor_rollout_ref.rollout.response_length}
      # Teacher inference is used for prompt_logprobs scoring in OPD. vLLM prompt_logprobs
      # does not support sampling temperature; teacher intervention generation has its own
      # sampling knobs under distillation.intervention.
      temperature: 1.0

# Key to route examples to the appropriate teacher model in multi-teacher setups. Should correspond to a field in the data proto, e.g., task.
teacher_key: data_source
